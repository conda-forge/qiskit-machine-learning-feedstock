schema_version: 1

context:
  name: qiskit-machine-learning
  version: "0.9.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 42d74f1a324457994fbb52d7de15f50e35cf04e0e77e1e21958f6b75a4cda360

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - qiskit >=2.0
    - dill >=0.3.4
    - numpy >=2.0
    - python >=${{ python_min }}
    - scikit-learn >=1.2
    - scipy >=1.4
    - setuptools >=40.1

tests:
  - python:
      imports:
        - qiskit_machine_learning
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "Qiskit Machine Learning: A library of quantum computing machine learning experiments"
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/qiskit-community/qiskit-machine-learning

extra:
  recipe-maintainers:
    - wshanks
    - BastianZim
